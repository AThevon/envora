name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck 0.11
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          ./shellcheck-v0.11.0/shellcheck --version
          ./shellcheck-v0.11.0/shellcheck -x -a ev.sh tests/run.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y age fzf gum jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install age fzf gum jq

      - name: Tests (default bash)
        run: bash tests/run.sh

      - name: Tests (macOS /bin/bash 3.2)
        if: runner.os == 'macOS'
        run: TEST_BASH=/bin/bash /bin/bash tests/run.sh
